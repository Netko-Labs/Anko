name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  schedule:
    - cron: "43 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  validate:
    name: Validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Lint and format
        run: bun run check

      - name: Test
        run: bun test

      - name: Typecheck and build frontend
        run: bun run build

  review:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR focusing on:
            - Code quality and adherence to project conventions
            - Security concerns and accidental secret exposure
            - Zustand selector stability and render behavior
            - Type safety and dependency changes
            - React performance

            Keep feedback actionable and concise. Use inline comments for specific issues.
            Approve when it is ready; request changes for significant issues.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Glob,Grep"

  package-smoke:
    name: Package ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: blacksmith-6vcpu-macos-15
            os: macos
          - label: Windows x64
            runner: blacksmith-4vcpu-windows-2025
            os: windows
          - label: Windows arm64
            runner: windows-11-arm
            os: windows
          - label: Linux x64
            runner: blacksmith-8vcpu-ubuntu-2404
            os: linux
            appimage_arch: x86_64
            appimage_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            os: linux
            appimage_arch: aarch64
            appimage_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Windows build tools
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rcedit -ErrorAction SilentlyContinue)) { choco install rcedit -y }

      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential squashfs-tools rpm xvfb xauth
          sudo gem install --no-document fpm -v 1.17.0
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage
          echo "${{ matrix.appimage_sha256 }}  /usr/local/bin/appimagetool" \
            | sha256sum --check --strict
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packaged app
        run: bun run build:app

      - name: Smoke launch packaged app on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          APP="build/Anko.app/Contents/MacOS/Anko"
          test -x "$APP" || { echo "::error::Packaged Anko executable is missing"; exit 1; }
          LOG="$RUNNER_TEMP/anko-launch.log"
          "$APP" >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID" || true
            cat "$LOG"
            echo "::error::Packaged Anko exited during launch smoke"
            exit 1
          fi
          kill "$PID"
          wait "$PID" || true
          trap - EXIT

      - name: Smoke launch packaged app on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $app = Resolve-Path "build/Anko/Anko.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "anko-launch.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "anko-launch.stderr.log"
          $process = Start-Process -FilePath $app -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Anko exited during launch smoke with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke launch packaged app on Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          APP="build/Anko/Anko"
          test -x "$APP" || { echo "::error::Packaged Anko executable is missing"; exit 1; }
          LOG="$RUNNER_TEMP/anko-launch.log"
          set +e
          timeout 12s xvfb-run -a "$APP" >"$LOG" 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            cat "$LOG"
            echo "::error::Packaged Anko exited during launch smoke with code $STATUS"
            exit 1
          fi

      - name: Verify bundled MCP bridge
        shell: bash
        run: |
          BRIDGE=$(find build -type f -path '*/sidecars/anko-mcp' ! -path 'build/sidecars/*' -print -quit)
          test -n "$BRIDGE" || { echo "::error::anko-mcp sidecar is missing"; exit 1; }
          echo "Bundled MCP bridge: $BRIDGE"
