name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  prepare-release:
    name: Validate and create draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(bun -e 'console.log(require("./package.json").version)')
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json $PACKAGE_VERSION"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $RELEASE_TAG does not point to a commit merged into main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build renderer and MCP bridge
        run: |
          bun run build
          bun run build:mcp-bridge

      - name: Collect release commits
        id: commits
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }')
          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMITS=$(git log "$PREVIOUS_TAG..$RELEASE_TAG" --pretty=format:'- %s (%h)' --no-merges)
          else
            COMMITS=$(git log "$RELEASE_TAG" --pretty=format:'- %s (%h)' --no-merges -20)
          fi
          DELIMITER="COMMITS_$(openssl rand -hex 8)"
          {
            echo "commits<<$DELIMITER"
            printf '%s\n' "$COMMITS"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        continue-on-error: true
        uses: vercel/ai-action@bd265252c9d1d8295ceda28dadb56ad9321c8ccc # v2
        with:
          api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          model: anthropic/claude-haiku-4-5
          system: |
            You write concise release notes for Anko, a cross-platform SQL desktop client.
            Be friendly and lightly playful while keeping every change technically clear.
          prompt: |
            Write release notes for Anko ${{ github.ref_name }}.

            Commits:
            ${{ steps.commits.outputs.commits }}

            Use these sections only when relevant:
            - Highlights
            - New Features
            - Improvements
            - Bug Fixes
            - Security

            Use present tense, omit commit hashes, and output only Markdown.

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Anko ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.text || steps.commits.outputs.commits }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-macos:
    name: Build macOS
    needs: prepare-release
    runs-on: blacksmith-6vcpu-macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Mirin CEF
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.mirinjs/cef
          key: mirin-cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: mirin-cef-${{ runner.os }}-${{ runner.arch }}-

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign, notarize, and package
        env:
          MIRIN_APP_VERSION: ${{ needs.prepare-release.outputs.version }}
          MIRIN_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MIRIN_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          MIRIN_NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MIRIN_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run release

      - name: Verify bundled MCP bridge
        run: |
          BRIDGE=$(find build -type f -path '*/sidecars/anko-mcp' ! -path 'build/sidecars/*' -print -quit)
          test -n "$BRIDGE" || { echo "::error::anko-mcp sidecar is missing"; exit 1; }
          test -x "$BRIDGE" || { echo "::error::anko-mcp sidecar is not executable"; exit 1; }
          echo "Bundled MCP bridge: $BRIDGE"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/upload-release-assets.sh

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: blacksmith-4vcpu-windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Mirin CEF
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.mirinjs/cef
          key: mirin-cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: mirin-cef-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y }
          if (-not (Get-Command rcedit -ErrorAction SilentlyContinue)) { choco install rcedit -y }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package
        env:
          MIRIN_APP_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: bun run release

      - name: Verify bundled MCP bridge
        shell: bash
        run: |
          BRIDGE=$(find build -type f -path '*/sidecars/anko-mcp' ! -path 'build/sidecars/*' -print -quit)
          test -n "$BRIDGE" || { echo "::error::anko-mcp sidecar is missing"; exit 1; }
          echo "Bundled MCP bridge: $BRIDGE"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/upload-release-assets.sh

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: blacksmith-8vcpu-ubuntu-2404
            appimage_arch: x86_64
            appimage_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
            appimage_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Mirin CEF
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.mirinjs/cef
          key: mirin-cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: mirin-cef-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential squashfs-tools rpm
          sudo gem install --no-document fpm -v 1.17.0
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage
          echo "${{ matrix.appimage_sha256 }}  /usr/local/bin/appimagetool" \
            | sha256sum --check --strict
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package
        env:
          MIRIN_APP_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: bun run release

      - name: Verify bundled MCP bridge
        run: |
          BRIDGE=$(find build -type f -path '*/sidecars/anko-mcp' ! -path 'build/sidecars/*' -print -quit)
          test -n "$BRIDGE" || { echo "::error::anko-mcp sidecar is missing"; exit 1; }
          test -x "$BRIDGE" || { echo "::error::anko-mcp sidecar is not executable"; exit 1; }
          echo "Bundled MCP bridge: $BRIDGE"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/upload-release-assets.sh

  publish-release:
    name: Publish release
    needs: [prepare-release, build-macos, build-windows, build-linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.prepare-release.outputs.release_id }},
              draft: false
            })
